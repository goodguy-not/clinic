# Milestone 10, checkpoint A3 — LOGS ROTATE AND DO NOT GROW WITHOUT BOUND.
# Installed as /etc/systemd/journald.conf.d/clinic.conf, then
# `systemctl restart systemd-journald`.
#
# The API, the web, the nightly jobs and the backup all log to stdout/stderr
# under systemd, so the journal is the one log store on the server. journald
# rotates its files itself; these bound the total size and the age.
# The API logs no personal data (README, Logging), so the month is a size and
# debugging window, not a privacy retention period.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemMaxFileSize=100M
MaxRetentionSec=1month
# Ubuntu also runs rsyslog, which would keep a second, separately rotated copy
# of every line in /var/log/syslog (found in the M10-A7 staging rehearsal).
# The journal is the one store, so nothing is forwarded to it.
ForwardToSyslog=no
# A misbehaving process cannot flood the journal.
RateLimitIntervalSec=30s
RateLimitBurst=10000
