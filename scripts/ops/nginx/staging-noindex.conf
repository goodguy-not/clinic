# Milestone 10, checkpoint A7 — STAGING ONLY (docs/DEPLOYMENT_RUNBOOK.md, Staging).
# Included inside the 443 server block of a staging host, never production.
# The application's robots.txt is built for the real public origin and allows
# the public pages; a staging copy must not be indexed even if a crawler
# reaches it.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

location = /robots.txt {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 200 "User-agent: *\nDisallow: /\n";
}
