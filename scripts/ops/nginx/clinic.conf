# Milestone 10, checkpoint A7 — the HTTPS front door (docs/DEPLOYMENT_RUNBOOK.md).
# Installed as /etc/nginx/sites-available/clinic and linked into sites-enabled.
# Replace every <SITE_HOST> with the owner-approved host name (PUBLIC_SITE_ORIGIN
# without https://) and the two certificate paths with the deployment's.
#
# The browser talks only to Next.js (127.0.0.1:3000). The API is never proxied:
# it is reached only by the web tier, over loopback.

# No client address and no query string: a family search is a query string,
# and the application's own logs carry no personal data (README, Logging).
log_format clinic '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name <SITE_HOST>;
    access_log /var/log/nginx/clinic.access.log clinic;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2`, not `http2 on;`: Ubuntu 24.04 ships nginx 1.24, which
    # predates the directive (newer nginx accepts this form with a warning).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <SITE_HOST>;
    access_log /var/log/nginx/clinic.access.log clinic;

    ssl_certificate     /etc/letsencrypt/live/<SITE_HOST>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<SITE_HOST>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:clinic_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Production only: never on a staging host or anything named localhost,
    # where it would pin the operator's browser to HTTPS for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # A photograph may be up to 12 MiB (MEDIA_SOURCE_MAX_BYTES) plus the form
    # around it. nginx's default of 1 MB would refuse every real photograph.
    client_max_body_size 13m;

    # Staging only: include scripts/ops/nginx/staging-noindex.conf here.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # SET, never appended: the web tier takes the first address as the
        # client's, so a client-supplied X-Forwarded-For must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
